<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#173e33" />
  <title>Offline | Sri Vinayaka Groups</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 10%,#315c49 0%,#173e33 40%,#10221c 100%);color:#f8f0df;font:16px/1.65 system-ui,-apple-system,sans-serif}
    main{width:min(100%,440px);padding:46px 28px;text-align:center;border:1px solid rgba(224,184,107,.3);border-radius:22px;background:rgba(15,35,28,.74);box-shadow:0 20px 55px rgba(0,0,0,.15)}
    .mark{display:grid;place-items:center;margin:0 auto 24px;width:86px;height:86px;border:2px solid #d8ae64;border-radius:50%;color:#e5bc77;font-size:28px;font-weight:700;letter-spacing:.05em}
    .eyebrow{font-size:11px;letter-spacing:.22em;color:#e6bd77;font-weight:700}h1{font:500 clamp(32px,7vw,44px)/1.15 Georgia,serif;margin:16px 0}p{margin:12px auto 0;max-width:335px;color:#c7d4c5;font-size:14px}
    button{border:0;border-radius:9px;background:#e5bc77;color:#17271e;font:700 14px system-ui,sans-serif;padding:14px 28px;min-height:48px;cursor:pointer;margin-top:27px}
    button:focus-visible{outline:3px solid white;outline-offset:4px}small{display:block;margin-top:26px;color:#a4b9a9;font-size:11px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">SV</div>
    <div class="eyebrow">SRI VINAYAKA GROUPS</div>
    <h1>You're offline.</h1>
    <p>Reconnect to explore the latest catalogue, prices and product availability. Your personal calculator remains on your device.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <small>SV Groups · Tumkur · Information-only catalogue</small>
  </main>
</body>
</html>
